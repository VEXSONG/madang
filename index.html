<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>온라인 서점</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page-container">
      <header class="page-header">
        <p class="eyebrow">ONLINE BOOKSTORE</p>
        <h1>도서 목록</h1>
        <p>원하는 도서 제목을 검색해 보세요.</p>
      </header>

      <section class="auth-section" aria-label="회원 기능">
        <div id="guestArea">
          <h2>회원가입 · 로그인</h2>
          <p class="auth-description">로그인하지 않아도 도서 목록을 볼 수 있습니다.</p>
          <form id="authForm" class="auth-form">
            <label for="emailInput">이메일</label>
            <input id="emailInput" type="email" autocomplete="email" required />

            <label for="passwordInput">비밀번호</label>
            <input
              id="passwordInput"
              type="password"
              autocomplete="current-password"
              minlength="6"
              required
            />

            <div class="auth-buttons">
              <button id="signUpButton" type="button">회원가입</button>
              <button id="signInButton" type="submit" class="secondary-button">로그인</button>
            </div>
          </form>
        </div>

        <div id="memberArea" hidden>
          <p class="signed-in-text"><strong id="userEmail"></strong>님으로 로그인했습니다.</p>
          <button id="signOutButton" type="button" class="secondary-button">로그아웃</button>
        </div>
        <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
      </section>

      <section class="search-section" aria-label="도서 검색">
        <form id="searchForm" class="search-form">
          <label for="searchInput">도서 제목 검색</label>
          <div class="search-controls">
            <input
              id="searchInput"
              name="search"
              type="search"
              placeholder="예: 자바스크립트"
              autocomplete="off"
            />
            <button type="submit">검색</button>
          </div>
        </form>
      </section>

      <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
      <section id="bookList" class="book-list" aria-label="도서 목록"></section>
      <p id="purchaseMessage" class="purchase-message" role="status" aria-live="polite"></p>

      <section id="ordersSection" class="orders-section" aria-label="내 주문" hidden>
        <h2>내 주문</h2>
        <p id="ordersMessage" class="orders-message" role="status" aria-live="polite"></p>
        <section id="ordersList" class="orders-list" aria-label="내 주문 목록"></section>
      </section>
    </main>

    <!-- SDK → config.js → app.js 순서가 중요합니다. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
